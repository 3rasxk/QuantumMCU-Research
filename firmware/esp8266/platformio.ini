; platformio.ini — NodeMCU ESP8266 (ESP-12E, 32-bit, 80MHz, ไม่มี FPU)
; N_QUBITS และ CIRCUIT_ID ต้องกำหนดจากภายนอกทุกครั้ง (ดู pc/phase2_sweep/esp8266_sweep.py)
; ตัวอย่างรันมือ: N_QUBITS=10 CIRCUIT_ID=0 pio run -e nodemcuv2 -t upload

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
build_src_filter = -<*> +<main.cpp>
build_flags =
    -D N_QUBITS=${sysenv.N_QUBITS}
    -D CIRCUIT_ID=${sysenv.CIRCUIT_ID}
monitor_speed = 115200
upload_speed = 115200

; Phase 3: Offload Benchmark — เฟิร์มแวร์คนละไฟล์ (src_offload/main_offload.cpp)
; ตัวอย่างรันมือ: N_QUBITS=10 CIRCUIT_ID=0 BAUD_RATE=115200 pio run -e nodemcuv2_offload -t upload
[env:nodemcuv2_offload]
extends = env:nodemcuv2
build_src_filter = -<*> +<../src_offload/main_offload.cpp>
build_flags =
    -D N_QUBITS=${sysenv.N_QUBITS}
    -D CIRCUIT_ID=${sysenv.CIRCUIT_ID}
    -D BAUD_RATE=${sysenv.BAUD_RATE}
upload_speed = 115200
