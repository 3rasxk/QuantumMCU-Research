; platformio.ini — ESP32 DevKit V1 (32-bit, 240MHz, มี FPU ฮาร์ดแวร์)
; N_QUBITS และ CIRCUIT_ID ต้องกำหนดจากภายนอกทุกครั้ง (ดู pc/phase2_sweep/esp32_sweep.py)
; ตัวอย่างรันมือ: N_QUBITS=14 CIRCUIT_ID=0 pio run -e esp32dev -t upload
;
; ข้อควรระวัง: literal float ทุกตัวใน firmware/common/*.hpp ต้องมี suffix f (เช่น 0.5f)
; ไม่งั้นจะ promote เป็น double โดยอัตโนมัติ ซึ่ง ESP32 FPU ไม่รองรับ double ใน hardware
; (ตรวจสอบแล้วว่า qsim.hpp และ circuits.hpp ใช้ f suffix ครบทุกตัวตั้งแต่ Phase 1)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = -<*> +<main.cpp>
build_flags =
    -D N_QUBITS=${sysenv.N_QUBITS}
    -D CIRCUIT_ID=${sysenv.CIRCUIT_ID}
monitor_speed = 115200
upload_speed = 115200

; Phase 3: Offload Benchmark — เฟิร์มแวร์คนละไฟล์ (src_offload/main_offload.cpp)
; ตัวอย่างรันมือ: N_QUBITS=14 CIRCUIT_ID=0 BAUD_RATE=115200 pio run -e esp32dev_offload -t upload
[env:esp32dev_offload]
extends = env:esp32dev
build_src_filter = -<*> +<../src_offload/main_offload.cpp>
build_flags =
    -D N_QUBITS=${sysenv.N_QUBITS}
    -D CIRCUIT_ID=${sysenv.CIRCUIT_ID}
    -D BAUD_RATE=${sysenv.BAUD_RATE}
upload_speed = 115200
