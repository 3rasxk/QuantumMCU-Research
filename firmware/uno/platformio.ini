; platformio.ini — Arduino Uno R3 (ATmega328P)
; N_QUBITS และ CIRCUIT_ID ต้องถูกกำหนดจากภายนอกทุกครั้งที่ build/upload
; (สคริปต์ pc/../phase2_sweep.sh เป็นผู้กำหนดผ่าน environment variable)
; ตัวอย่างรันมือ: N_QUBITS=6 CIRCUIT_ID=0 pio run -e uno -t upload

; *** เวอร์ชัน platform ถูกปักไว้ (pinned) สำหรับรอบเก็บข้อมูล REPS=100 ***
; ตัวเลขที่งานนี้วัดคือ "เวลา" ซึ่งขึ้นกับ compiler/toolchain โดยตรง ถ้า platform
; ถูกอัปเดตกลางรอบ (เช่น `pio pkg update`) เฟิร์มแวร์ที่ build ได้จะต่างจากของเดิม
; โดยไม่มีอะไรเตือน — ข้อมูลสองก้อนจะเทียบกันไม่ได้อีกต่อไป ค่าที่ปักไว้คือเวอร์ชัน
; ที่ติดตั้งอยู่จริงตอน preflight (docs/preflight_report.md, finding M4) ไม่ใช่การ
; อัปเกรด: build ที่ได้ต้องเหมือนเดิมทุก byte (ยืนยันแล้วด้วยการ rebuild เทียบขนาด
; flash/RAM และ firmware source hash)
; เวอร์ชัน framework/toolchain ที่ถูกดึงมาจริงถูกบันทึกต่อ session ลง
; data/raw/telemetry/env/<session_id>.json (telemetry._pio_packages)

[env:uno]
platform = atmelavr@5.3.0
board = uno
framework = arduino
build_src_filter = -<*> +<main.cpp>
build_flags =
    -std=c++11
    -D N_QUBITS=${sysenv.N_QUBITS}
    -D CIRCUIT_ID=${sysenv.CIRCUIT_ID}
build_unflags = -std=gnu++11
monitor_speed = 115200
upload_speed = 115200

; Phase 3: Offload Benchmark — เฟิร์มแวร์คนละไฟล์ (src_offload/main_offload.cpp)
; ตัวอย่างรันมือ: N_QUBITS=6 CIRCUIT_ID=0 BAUD_RATE=115200 pio run -e uno_offload -t upload
[env:uno_offload]
extends = env:uno
build_src_filter = -<*> +<../src_offload/main_offload.cpp>
build_flags =
    -std=c++11
    -D N_QUBITS=${sysenv.N_QUBITS}
    -D CIRCUIT_ID=${sysenv.CIRCUIT_ID}
    -D BAUD_RATE=${sysenv.BAUD_RATE}
