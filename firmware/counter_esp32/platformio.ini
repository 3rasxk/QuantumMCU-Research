; platformio.ini -- ESP32 pulse COUNTER (docs/design/counter_design.md, stage S1).
; This is NOT a board under test: it is the timing reference. Never flash a target with it.
; platform pinned to the SAME espressif32 version as firmware/esp32 so the toolchain/core
; (Arduino-ESP32 2.0.17, IDF 4.4) matches; legacy MCPWM/PCNT/timer drivers are used.
[env:counter]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
build_flags =
    -I ../common
monitor_speed = 921600
upload_speed = 115200
